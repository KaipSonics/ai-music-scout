name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout original Scout for comparison
        uses: actions/checkout@v4
        with:
          ref: 700cad8709b76f07414048fce1b0c869f207d4ea
          path: .v2-comparison

      - name: Build isolated comparison
        run: |
          node scripts/prepare-v2-comparison.mjs .v2-comparison
          ln -s "$GITHUB_WORKSPACE/node_modules" .v2-comparison/node_modules
          ./node_modules/.bin/vite build .v2-comparison --base /ai-music-scout/v2-test/
          cp -R .v2-comparison/dist dist/v2-test

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
