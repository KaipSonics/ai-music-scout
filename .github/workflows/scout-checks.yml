name: Scout checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: scout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:desktop
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scout-ui-results
          path: test-results/
  tauri:
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Native Linux dependencies
        timeout-minutes: 5
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib scout_db::tests
