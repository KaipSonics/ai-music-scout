name: VK CORS diagnostic
on:
  push:
    branches: [diagnostic/vk-cors]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check VK public CORS headers without credentials
        run: |
          node <<'NODE'
          (async () => {
            for (const method of ['GET', 'POST', 'OPTIONS']) {
              try {
                const response = await fetch('https://api.vk.com/method/users.get?v=5.131', {
                  method, headers: { Origin: 'https://kaipsonics.github.io', ...(method === 'OPTIONS' ? {'Access-Control-Request-Method': 'POST'} : {}) },
                  signal: AbortSignal.timeout(15000), redirect: 'follow'
                });
                console.log(JSON.stringify({method,status:response.status,origin:response.headers.get('access-control-allow-origin'),methods:response.headers.get('access-control-allow-methods')}));
              } catch (e) { console.log(JSON.stringify({method,error:e.name})); }
            }
          })();
          NODE
